title: BurTracker
views:
  - title: Meals
    path: meals
    icon: mdi:food
    cards:
      - type: calendar
        entities:
          - calendar.burtracker_meals
      - type: entities
        title: Tonight
        entities:
          - entity: sensor.today_s_meal
            name: Dinner
          - entity: sensor.pantry_barcode_observations
            name: Pantry items
      - type: markdown
        title: Pantry items
        content: >-
          {% set items = state_attr('sensor.pantry_barcode_observations', 'items') or [] %}
          {% if items %}
          {% for item in items %}
          - **{{ item.product_name or 'Unidentified product' }}** (`{{ item.barcode }}`) — last seen {{ item.seen_at | as_datetime | as_local | relative_time }}; scanned {{ item.scans }} time(s); {{ item.confidence }}{% if item.confirmed_packages is not none %}; {{ item.confirmed_packages }} confirmed package(s){% endif %}
          {% endfor %}
          {% else %}
          No pantry barcode observations yet.
          {% endif %}
      - type: markdown
        title: Tonight's recipe
        content: >-
          {% set meal = states('sensor.burtracker_todays_meal') %}
          **{{ meal }}**

          **Ingredients**
          {{ state_attr('sensor.burtracker_todays_meal', 'ingredients') or 'not recorded' }}

          **Method**
          {{ state_attr('sensor.burtracker_todays_meal', 'instructions') or 'not recorded' }}
      - type: entities
        title: Record meal feedback
        show_header_toggle: false
        entities:
          - entity: input_select.burtracker_feedback_metric
            name: Feedback category
          - entity: input_number.burtracker_feedback_score
            name: Score (1 = poor, 5 = great)
          - entity: input_text.burtracker_feedback_comment
            name: Comment (optional)
          - type: button
            name: Save feedback
            icon: mdi:content-save
            tap_action:
              action: call-service
              service: script.burtracker_submit_meal_feedback
      - type: button
        name: We are not home tonight
        icon: mdi:home-export-outline
        tap_action:
          action: call-service
          service: burtracker.set_meal_status
          service_data:
            status: not_home
      - type: button
        name: We ate out
        icon: mdi:silverware-fork-knife
        tap_action:
          action: call-service
          service: burtracker.set_meal_status
          service_data:
            status: ate_out
      - type: markdown
        title: Feedback actions
        content: >-
          Feedback is recorded separately for each category: enjoyment, cooking
          difficulty, portions, family approval, cost, or other. Enter a score
          from 1 (poor) to 5 (great), and an optional note, then save.
          To install the helper entities and save script, merge
          `docs/meal-feedback-helpers.yaml` into your Home Assistant YAML
          configuration and reload helpers/scripts (or restart Home Assistant).
