title: BurTracker
views:
  - title: Meals
    path: meals
    icon: mdi:food
    cards:
      - type: calendar
        entities:
          - calendar.burtracker_meals
      - type: entities
        title: Tonight
        entities:
          - entity: sensor.today_s_meal
            name: Dinner
          - entity: sensor.pantry_barcode_observations
            name: Pantry items
      - type: markdown
        title: Pantry items
        content: >-
          {% set items = state_attr('sensor.pantry_barcode_observations', 'items') or [] %}
          {% if items %}
          {% for item in items %}
          - **{{ item.product_name or 'Unidentified product' }}** (`{{ item.barcode }}`) — last seen {{ item.seen_at | as_datetime | as_local | relative_time }}; scanned {{ item.scans }} time(s); {{ item.confidence }}{% if item.confirmed_packages is not none %}; {{ item.confirmed_packages }} confirmed package(s){% endif %}
          {% endfor %}
          {% else %}
          No pantry barcode observations yet.
          {% endif %}
      - type: entities
        title: Reject or rerun dinner suggestion
        show_header_toggle: false
        entities:
          - entity: text.burtracker_meal_rerun_reason
            name: Optional reason (e.g. no tofu)
          - entity: button.burtracker_rerun_meal_suggestion
            name: Reject current suggestion & generate a different one
          - entity: sensor.burtracker_meal_rerun
            name: Rerun status
      - type: markdown
        title: Latest rerun draft
        content: >-
          {% set draft = state_attr('sensor.burtracker_meal_rerun', 'draft') or {} %}
          {% set status = state_attr('sensor.burtracker_meal_rerun', 'status') %}
          **{{ states('sensor.burtracker_meal_rerun') }}**{% if status %} — {{ status }}{% endif %}

          The button rejects the displayed/today's suggestion and asks for a different one. Add an optional constraint first if useful.

          {% if state_attr('sensor.burtracker_meal_rerun', 'rejected_title') %}
          Rejected: {{ state_attr('sensor.burtracker_meal_rerun', 'rejected_title') }}
          {% endif %}
          {% if state_attr('sensor.burtracker_meal_rerun', 'error') %}
          {{ state_attr('sensor.burtracker_meal_rerun', 'error') }}
          {% endif %}

          {% if draft %}
          {% set total = draft.get('total_package_cost_isk') %}
          {% if total is not none %}Basket estimate: **{{ total }} ISK**{% endif %}
          {% set macros = draft.get('macro_estimates') or {} %}
          {% if macros %}
          Macros/portion: {{ macros }}
          {% endif %}
          {{ draft.get('ingredients_text', '') }}
          {{ draft.get('instructions', '') }}
          {% endif %}
      - type: markdown
        title: Tonight's recipe
        content: >-
          {% set meal = states('sensor.today_s_meal') %}
          **{{ meal }}**

          **Ingredients**
          {{ state_attr('sensor.today_s_meal', 'ingredients') or 'not recorded' }}

          **Method**
          {{ state_attr('sensor.today_s_meal', 'instructions') or 'not recorded' }}
      - type: markdown
        title: Tomorrow's dinner
        content: >-
          {% set meal = states('sensor.tomorrow_s_meal') %}
          **{{ meal }}**

          {% set total = state_attr('sensor.tomorrow_s_meal', 'cost_isk') %}
          {% set each = state_attr('sensor.tomorrow_s_meal', 'cost_per_portion_isk') %}
          {% if total is not none %}
          Krónan package basket: **{{ total }} ISK** ({{ each }} ISK per planned portion).
          Prices observed {{ state_attr('sensor.tomorrow_s_meal', 'price_observed_at') }}. Catalog/weight prices may differ at checkout.
          {% endif %}

          {% set items = state_attr('sensor.tomorrow_s_meal', 'shopping_items') or [] %}
          {% if items %}
          **Buy from Krónan**
          {% for item in items %}
          - {{ item.packages }} × **{{ item.product_name }}** — {{ item.unit_price_isk }} ISK each, {{ item.line_total_isk }} ISK total (`{{ item.sku }}`; {{ item.price_info }})
          {% endfor %}
          {% else %}
          No verified Krónan shopping quote saved for tomorrow yet.
          {% endif %}

          **Ingredients**
          {{ state_attr('sensor.tomorrow_s_meal', 'ingredients') or 'not recorded' }}

          **Method**
          {{ state_attr('sensor.tomorrow_s_meal', 'instructions') or 'not recorded' }}
      - type: entities
        title: Record meal feedback
        show_header_toggle: false
        entities:
          - entity: select.burtracker_feedback_metric
            name: Feedback category
          - entity: number.burtracker_feedback_score
            name: Score (1 = poor, 5 = great)
          - entity: text.burtracker_feedback_comment
            name: Comment (optional)
          - type: button
            name: Save feedback
            icon: mdi:content-save
            tap_action:
              action: call-service
              service: burtracker.record_meal_feedback
      - type: button
        name: We are not home tonight
        icon: mdi:home-export-outline
        tap_action:
          action: call-service
          service: burtracker.set_meal_status
          service_data:
            status: not_home
      - type: button
        name: We ate out
        icon: mdi:silverware-fork-knife
        tap_action:
          action: call-service
          service: burtracker.set_meal_status
          service_data:
            status: ate_out
      - type: markdown
        title: Feedback
        content: >-
          Choose one metric at a time and enter its 1–5 score and optional note.
          Enjoyment and cooking difficulty are tracked separately. Press Save feedback
          to record the selected metric for today's meal.
