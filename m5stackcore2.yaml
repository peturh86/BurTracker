esphome:
  name: burtracker-hardware-test
  friendly_name: BurTracker Hardware Test

  includes:
    - <M5Unified.h>
    - <esp_system.h>
    - burtracker_ui.h
    - <M5ModuleQRCode.h>

  libraries:
    - "M5GFX=https://github.com/m5stack/M5GFX.git"
    - "M5Unified=https://github.com/m5stack/M5Unified.git"
    - "M5Module-QRCode=https://github.com/m5stack/M5Module-QRCode.git"

  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(scanner_ready) = false;
          char session[17];
          snprintf(session, sizeof(session), "%08lx%08lx",
                   (unsigned long) esp_random(), (unsigned long) esp_random());
          id(boot_session) = session;
          id(accepted_scans).publish_state(0);

          auto config = M5.config();
          config.internal_spk = false;
          config.internal_mic = false;
          config.internal_imu = false;
          config.internal_rtc = false;
          config.output_power = true;
          M5.begin(config);

          M5.Display.setRotation(3);
          M5.Display.setBrightness(160);
          burtracker::screen.render();

          id(scanner) = new M5ModuleQRCode();

          auto scanner_config = id(scanner)->getConfig();
          scanner_config.pin_rx = 13;
          scanner_config.pin_tx = 14;
          scanner_config.serial = &Serial1;
          id(scanner)->setConfig(scanner_config);

          if (!id(scanner)->begin()) {
            ESP_LOGE("scanner", "Module I2C initialization failed");
            burtracker::screen.title = "Scanner not found";
            burtracker::screen.render();
            delete id(scanner);
            id(scanner) = nullptr;
            return;
          }

          ESP_LOGI("scanner", "Module initialized; waiting for startup");

      # ESPHome delay action: does not block the main loop.
      - delay: 1500ms

      - lambda: |-
          if (id(scanner) == nullptr) return;

          while (Serial1.available()) {
            Serial1.read();
          }

          const uint8_t query[] = {0x43, 0x02, 0xC1};
          Serial1.write(query, sizeof(query));

      # Allow the complete firmware response to arrive.
      - delay: 500ms

      - lambda: |-
          if (id(scanner) == nullptr) return;

          std::vector<uint8_t> response;
          while (Serial1.available() && response.size() < 256) {
            response.push_back(
                static_cast<uint8_t>(Serial1.read()));
          }

          bool valid = false;
          size_t length = 0;

          if (response.size() >= 5 &&
              response[0] == 0x44 &&
              response[1] == 0x02 &&
              response[2] == 0xC1) {
            length = (static_cast<size_t>(response[3]) << 8)
                     | response[4];
            valid = length > 0 && response.size() >= 5 + length;
          }

          if (!valid) {
            ESP_LOGE("scanner", "Invalid firmware reply: %u bytes",
                     static_cast<unsigned>(response.size()));
            burtracker::screen.title = "No scanner response";
            burtracker::screen.render();
            return;
          }

          std::string version(response.begin() + 5,
                              response.begin() + 5 + length);
          ESP_LOGI("scanner", "Firmware: %s", version.c_str());

          id(scanner)->setFillLightMode(
              QRCodeM14::FILL_LIGHT_ON_DECODE);
          id(scanner)->setPosLightMode(
              QRCodeM14::POS_LIGHT_ON_DECODE);
          id(scanner)->setMotionSensitivity(1);
          id(scanner)->setSameCodeNoDelay(false);
          id(scanner)->setSameCodeInterval(3000);
          id(scanner)->setTriggerMode(
              QRCodeM14::TRIGGER_MODE_MOTION_SENSING);

          burtracker::screen.select(0);

          id(scanner_ready) = true;
          ESP_LOGI("scanner", "Scene-change scanning ready");

esp32:
  board: m5stack-core2
  flash_size: 16MB
  framework:
    type: arduino

logger:
  level: DEBUG

globals:
  - id: scanner
    type: M5ModuleQRCode*
    restore_value: false
    initial_value: "nullptr"

  - id: scanner_ready
    type: bool
    restore_value: false
    initial_value: "false"

  - id: boot_session
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: active_request
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: active_barcode
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: awaiting_reply
    type: bool
    restore_value: false
    initial_value: "false"
  - id: request_started
    type: uint32_t
    restore_value: false
    initial_value: "0"

interval:
  - interval: 100ms
    then:
      - lambda: |-
          M5.update();
          if (id(scanner_ready)) {
            // Core2 touch-strip buttons use physical coordinates: C is left at rotation 3.
            int selected = M5.BtnC.wasPressed() ? 0 :
                           M5.BtnB.wasPressed() ? 1 : M5.BtnA.wasPressed() ? 2 : -1;
            if (selected >= 0) {
              id(awaiting_reply) = false;
              burtracker::screen.select(selected);
            }
          }
          if (id(awaiting_reply) && millis() - id(request_started) > 30000) {
            id(awaiting_reply) = false;
            burtracker::screen.title = "No reply from HA";
            burtracker::screen.detail = "Result is unknown";
            burtracker::screen.footer = "CHECK CONNECTION / TRY AGAIN";
            burtracker::screen.render();
          }

          if (!id(scanner_ready)) return;

          // Always listen: no button press is required.
          id(scanner)->update();
          if (!id(scanner)->available()) return;

          std::string barcode = id(scanner)->getScanResult();

          // Preserve leading zeroes; remove line endings only.
          while (!barcode.empty() &&
                 (barcode.back() == '\r' ||
                  barcode.back() == '\n')) {
            barcode.pop_back();
          }
          if (barcode.empty()) return;
          if (burtracker::screen.mode == 1 && !burtracker::screen.spoil_armed) return;

          // Additional display/log protection against rapid repeats.
          static std::string last_barcode;
          static uint32_t last_displayed = 0;
          static int last_mode = -1;
          const uint32_t now = millis();

          if (barcode == last_barcode && last_mode == burtracker::screen.mode &&
              now - last_displayed < 3000) {
            return;
          }

          last_barcode = barcode;
          last_mode = burtracker::screen.mode;
          last_displayed = now;

          ESP_LOGI("scanner", "Barcode: %s", barcode.c_str());
          id(last_barcode_sensor).publish_state(barcode);
          static uint32_t scan_count = 0;
          id(accepted_scans).publish_state(++scan_count);
          id(active_request) = id(boot_session) + "-" + std::to_string(scan_count);
          id(active_barcode) = barcode;
          id(awaiting_reply) = true;
          id(request_started) = now;
          burtracker::screen.waiting();
          id(publish_scan)->execute(barcode, id(active_request),
                                   std::string(burtracker::screen.intent()));

# Home Assistant connects through the native ESPHome API.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret burtracker_api_key
  reboot_timeout: 0s
  actions:
    - action: burtracker_result
      variables:
        request_id: string
        barcode: string
        lookup_status: string
        product_name: string
      then:
        - lambda: |-
            // Discard delayed responses, including after a display timeout.
            if (!id(awaiting_reply) || request_id != id(active_request) ||
                barcode != id(active_barcode)) return;
            id(awaiting_reply) = false;
            burtracker::screen.result(lookup_status, product_name, "", "added");
    - action: burtracker_result_v2
      variables:
        request_id: string
        barcode: string
        lookup_status: string
        product_name: string
        price_text: string
        outcome: string
      then:
        - lambda: |-
            if (!id(awaiting_reply) || request_id != id(active_request) ||
                barcode != id(active_barcode)) return;
            id(awaiting_reply) = false;
            burtracker::screen.result(lookup_status, product_name, price_text, outcome);

ota:
  - platform: esphome
    password: !secret burtracker_ota_password

# Called only after the scanner's repeat filter accepts a barcode.
# Live delivery only; request IDs correlate display feedback. No offline queue.
script:
  - id: publish_scan
    parameters:
      barcode: string
      request_id: string
      scan_intent: string
    then:
      - homeassistant.event:
          event: esphome.burtracker_scan
          data:
            schema_version: "1"
            tracker: !lambda 'return App.get_name();'
            barcode: !lambda 'return barcode;'
            intent: !lambda 'return scan_intent;'
            request_id: !lambda 'return request_id;'

# Diagnostic entities; business logic should consume scan events, not state changes.
text_sensor:
  - platform: template
    id: last_barcode_sensor
    name: "Last Barcode"
    icon: mdi:barcode
    update_interval: never

sensor:
  - platform: template
    id: accepted_scans
    name: "Accepted Scans Since Boot"
    icon: mdi:counter
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never

binary_sensor:
  - platform: status
    name: "Connection"
    entity_category: diagnostic
  - platform: template
    name: "Scanner Ready"
    entity_category: diagnostic
    lambda: 'return id(scanner_ready);'
