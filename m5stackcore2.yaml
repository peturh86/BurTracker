esphome:
  name: burtracker-hardware-test
  friendly_name: BurTracker Hardware Test

  includes:
    - <M5Unified.h>
    - <M5ModuleQRCode.h>

  libraries:
    - "M5GFX=https://github.com/m5stack/M5GFX.git"
    - "M5Unified=https://github.com/m5stack/M5Unified.git"
    - "M5Module-QRCode=https://github.com/m5stack/M5Module-QRCode.git"

  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(scanner_ready) = false;
          id(accepted_scans).publish_state(0);

          auto config = M5.config();
          config.internal_spk = false;
          config.internal_mic = false;
          config.internal_imu = false;
          config.internal_rtc = false;
          config.output_power = true;
          M5.begin(config);

          M5.Display.setRotation(3);
          M5.Display.setBrightness(160);
          M5.Display.fillScreen(TFT_BLACK);
          M5.Display.setTextColor(TFT_WHITE, TFT_BLACK);
          M5.Display.setTextSize(2);
          M5.Display.setCursor(10, 10);
          M5.Display.println("Starting scanner...");

          id(scanner) = new M5ModuleQRCode();

          auto scanner_config = id(scanner)->getConfig();
          scanner_config.pin_rx = 13;
          scanner_config.pin_tx = 14;
          scanner_config.serial = &Serial1;
          id(scanner)->setConfig(scanner_config);

          if (!id(scanner)->begin()) {
            ESP_LOGE("scanner", "Module I2C initialization failed");
            M5.Display.println("Module not found");
            delete id(scanner);
            id(scanner) = nullptr;
            return;
          }

          ESP_LOGI("scanner", "Module initialized; waiting for startup");

      # ESPHome delay action: does not block the main loop.
      - delay: 1500ms

      - lambda: |-
          if (id(scanner) == nullptr) return;

          while (Serial1.available()) {
            Serial1.read();
          }

          const uint8_t query[] = {0x43, 0x02, 0xC1};
          Serial1.write(query, sizeof(query));

      # Allow the complete firmware response to arrive.
      - delay: 500ms

      - lambda: |-
          if (id(scanner) == nullptr) return;

          std::vector<uint8_t> response;
          while (Serial1.available() && response.size() < 256) {
            response.push_back(
                static_cast<uint8_t>(Serial1.read()));
          }

          bool valid = false;
          size_t length = 0;

          if (response.size() >= 5 &&
              response[0] == 0x44 &&
              response[1] == 0x02 &&
              response[2] == 0xC1) {
            length = (static_cast<size_t>(response[3]) << 8)
                     | response[4];
            valid = length > 0 && response.size() >= 5 + length;
          }

          if (!valid) {
            ESP_LOGE("scanner", "Invalid firmware reply: %u bytes",
                     static_cast<unsigned>(response.size()));
            M5.Display.println("No valid UART reply");
            return;
          }

          std::string version(response.begin() + 5,
                              response.begin() + 5 + length);
          ESP_LOGI("scanner", "Firmware: %s", version.c_str());

          id(scanner)->setFillLightMode(
              QRCodeM14::FILL_LIGHT_ON_DECODE);
          id(scanner)->setPosLightMode(
              QRCodeM14::POS_LIGHT_ON_DECODE);
          id(scanner)->setMotionSensitivity(1);
          id(scanner)->setSameCodeNoDelay(false);
          id(scanner)->setSameCodeInterval(3000);
          id(scanner)->setTriggerMode(
              QRCodeM14::TRIGGER_MODE_MOTION_SENSING);

          M5.Display.fillScreen(TFT_BLACK);
          M5.Display.setTextColor(TFT_WHITE, TFT_BLACK);
          M5.Display.setCursor(10, 10);
          M5.Display.println("Show a barcode");
          M5.Display.setCursor(10, 200);
          M5.Display.println("Scene detection active");

          id(scanner_ready) = true;
          ESP_LOGI("scanner", "Scene-change scanning ready");

esp32:
  board: m5stack-core2
  flash_size: 16MB
  framework:
    type: arduino

logger:
  level: DEBUG

globals:
  - id: scanner
    type: M5ModuleQRCode*
    restore_value: false
    initial_value: "nullptr"

  - id: scanner_ready
    type: bool
    restore_value: false
    initial_value: "false"

interval:
  - interval: 100ms
    then:
      - lambda: |-
          M5.update();

          if (!id(scanner_ready)) return;

          // Always listen: no button press is required.
          id(scanner)->update();
          if (!id(scanner)->available()) return;

          std::string barcode = id(scanner)->getScanResult();

          // Preserve leading zeroes; remove line endings only.
          while (!barcode.empty() &&
                 (barcode.back() == '\r' ||
                  barcode.back() == '\n')) {
            barcode.pop_back();
          }
          if (barcode.empty()) return;

          // Additional display/log protection against rapid repeats.
          static std::string last_barcode;
          static uint32_t last_displayed = 0;
          const uint32_t now = millis();

          if (barcode == last_barcode &&
              now - last_displayed < 3000) {
            return;
          }

          last_barcode = barcode;
          last_displayed = now;

          ESP_LOGI("scanner", "Barcode: %s", barcode.c_str());
          id(last_barcode_sensor).publish_state(barcode);
          static uint32_t scan_count = 0;
          id(accepted_scans).publish_state(++scan_count);
          id(publish_scan)->execute(barcode);

          M5.Display.fillScreen(TFT_BLACK);
          M5.Display.setTextColor(TFT_WHITE, TFT_BLACK);
          M5.Display.setTextSize(2);
          M5.Display.setCursor(10, 10);
          M5.Display.println("Last barcode:");

          M5.Display.setTextColor(TFT_GREEN, TFT_BLACK);
          M5.Display.setCursor(10, 65);
          M5.Display.println(barcode.c_str());

          M5.Display.setTextColor(TFT_WHITE, TFT_BLACK);
          M5.Display.setCursor(10, 200);
          M5.Display.println("Show another barcode");

# Home Assistant connects through the native ESPHome API.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret burtracker_api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret burtracker_ota_password

# Called only after the scanner's repeat filter accepts a barcode.
# Live delivery only: no offline queue or processing acknowledgement.
script:
  - id: publish_scan
    parameters:
      barcode: string
    then:
      - homeassistant.event:
          event: esphome.burtracker_scan
          data:
            schema_version: "1"
            tracker: !lambda 'return App.get_name();'
            barcode: !lambda 'return barcode;'
            intent: "shopping"

# Diagnostic entities; business logic should consume scan events, not state changes.
text_sensor:
  - platform: template
    id: last_barcode_sensor
    name: "Last Barcode"
    icon: mdi:barcode
    update_interval: never

sensor:
  - platform: template
    id: accepted_scans
    name: "Accepted Scans Since Boot"
    icon: mdi:counter
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never

binary_sensor:
  - platform: status
    name: "Connection"
    entity_category: diagnostic
  - platform: template
    name: "Scanner Ready"
    entity_category: diagnostic
    lambda: 'return id(scanner_ready);'
